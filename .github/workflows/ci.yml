name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm tra cú pháp
        run: for f in *.js public/app.js public/grade.js test/*.js; do node --check "$f"; done
      - name: Chạy kiểm thử
        run: npm test
