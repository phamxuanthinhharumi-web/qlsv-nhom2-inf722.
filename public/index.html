<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Phần mềm quản lý sinh viên: danh sách sinh viên, bảng điểm, GPA theo học kỳ, thống kê lớp học.">
<meta name="theme-color" content="#297a2e">
<meta name="robots" content="noindex">
<title>Quản lý sinh viên</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23297a2e'/%3E%3Cpath d='M32 14 8 26l24 12 20-10v14h4V26z' fill='%23fff'/%3E%3Cpath d='M18 36v10c0 4 8 8 14 8s14-4 14-8V36l-14 7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js" defer></script>
<script src="/grade.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<noscript><p style="padding:20px;text-align:center">Vui lòng bật JavaScript để sử dụng ứng dụng.</p></noscript>

<div id="boot" class="auth"><p class="sub">Đang tải…</p></div>

<div id="authScreen" class="auth" hidden>
  <form id="loginForm" class="auth-card">
    <div class="brand"><div class="brand-ico"><i class="ri-graduation-cap-fill"></i></div><div><b>QL Sinh Viên</b><small>Hệ thống quản lý</small></div></div>
    <h1>Đăng nhập</h1>
    <p class="sub" style="margin-bottom:18px">Dùng tài khoản do nhà trường / quản trị viên cấp.</p>
    <div id="loginErr" class="form-err" role="alert" hidden></div>
    <div class="fld"><label class="f-lbl" for="loginUser">Tên đăng nhập</label><input class="inp" id="loginUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64"></div>
    <div class="fld"><label class="f-lbl" for="loginPass">Mật khẩu</label><input class="inp" id="loginPass" name="password" type="password" autocomplete="current-password" required maxlength="200"></div>
    <button type="submit" class="btn btn-primary" style="width:100%"><i class="ri-login-box-line"></i> Đăng nhập</button>
  </form>
</div>

<div id="pwScreen" class="auth" hidden>
  <form id="pwForm" class="auth-card">
    <div class="brand"><div class="brand-ico"><i class="ri-key-2-fill"></i></div><div><b>Đổi mật khẩu</b><small id="pwIntro"></small></div></div>
    <div id="pwErr" class="form-err" role="alert" hidden style="margin-top:16px"></div>
    <div class="fld" style="margin-top:16px"><label class="f-lbl" for="pwCur">Mật khẩu hiện tại</label><input class="inp" id="pwCur" type="password" autocomplete="current-password" required maxlength="200"></div>
    <div class="fld"><label class="f-lbl" for="pwNew">Mật khẩu mới (tối thiểu 8 ký tự)</label><input class="inp" id="pwNew" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div>
    <div class="fld"><label class="f-lbl" for="pwConfirm">Nhập lại mật khẩu mới</label><input class="inp" id="pwConfirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="submit" class="btn btn-primary"><i class="ri-save-line"></i> Lưu mật khẩu</button><button type="button" class="btn btn-secondary" id="pwCancel">Hủy</button><button type="button" class="btn btn-secondary" id="logoutFromPw">Đăng xuất</button></div>
  </form>
</div>

<div id="appShell" hidden>
  <div class="app">
    <aside class="sidebar no-print">
      <div class="side-card">
        <div class="brand">
          <div class="brand-ico"><i class="ri-graduation-cap-fill"></i></div>
          <div><b>QL Sinh Viên</b><small>Hệ thống quản lý</small></div>
        </div>
        <nav id="nav" class="nav" aria-label="Điều hướng chính"></nav>
        <div class="userbox">
          <div class="uname" id="uName"></div>
          <div class="urole" id="uRole"></div>
          <div class="ubtns">
            <button class="btn btn-secondary btn-sm" id="btnPw" type="button"><i class="ri-key-2-line"></i> Đổi mật khẩu</button>
            <button class="btn btn-secondary btn-sm" id="btnLogout" type="button"><i class="ri-logout-box-r-line"></i> Đăng xuất</button>
          </div>
        </div>
      </div>
    </aside>
    <main class="main" id="content" aria-live="polite"></main>
  </div>
  <div class="footer">© <span id="yr"></span> QL Sinh Viên · Điểm tổng kết = 40% quá trình + 60% thi · Thang điểm 10 và quy đổi thang 4</div>
</div>

<div id="modal" class="modal-back" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3><p id="mMsg"></p>
    <div class="m-actions"><button class="btn btn-secondary" id="mCancel" type="button">Hủy</button><button class="btn btn-danger-solid" id="mOk" type="button">Xác nhận</button></div>
  </div>
</div>
<div id="toastBox" class="toast-box" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
</body>
</html>
