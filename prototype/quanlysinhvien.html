<html style="margin:0;padding:0;">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4/fonts/remixicon.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js"></script>
<script>
(function(){
  var s=document.createElement('style');
  s.textContent=':root{--bg:#faf9f4;--card:#ffffff;--text:#0f172a;--muted:#64748b;--accent:#297a2e;--accent-soft:rgba(41,122,46,.14);--accent2:#d97706;--accent2-soft:rgba(217,119,6,.14);--border:rgba(15,23,42,.08)}'
    +'*{font-family:"Baloo 2",sans-serif;box-sizing:border-box}'
    +'.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;transition:all .18s ease;font-size:14px}'
    +'.nav-item:hover{background:var(--accent-soft);color:var(--accent)}'
    +'.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(41,122,46,.3)}'
    +'.tbl-row{transition:background .15s ease}.tbl-row:hover{background:rgba(41,122,46,.05)}'
    +'.inp{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff;color:var(--text);outline:none;transition:border-color .15s}'
    +'.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}'
    +'.btn-primary{padding:9px 18px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer;transition:transform .12s,box-shadow .15s;box-shadow:0 3px 10px rgba(41,122,46,.25)}'
    +'.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(41,122,46,.35)}'
    +'.btn-secondary{padding:9px 16px;border-radius:9px;background:#fff;color:var(--text);font-weight:600;font-size:14px;border:1px solid var(--border);cursor:pointer;transition:all .15s}'
    +'.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}'
    +'.btn-danger{padding:6px 12px;border-radius:7px;background:#fef2f2;color:#dc2626;font-weight:600;font-size:13px;border:1px solid #fecaca;cursor:pointer}'
    +'.btn-edit{padding:6px 12px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;border:1px solid transparent;cursor:pointer;margin-right:6px}'
    +'.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}'
    +'.metric-card{transition:transform .2s ease,box-shadow .2s ease}.metric-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08)}'
    +'.fade-in{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}'
    +'label.f-lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}'
    +'.hk-panel{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fcfcf9}'
    +'.hk-title{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--border)}'
    +'.term-card{border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:4px solid var(--accent)}'
    +'.toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:99;animation:fadeIn .3s ease}';
  document.head.appendChild(s);
})();
</script>
<div style="background-color:transparent;box-sizing:border-box;">
<div style="background:var(--bg);color:var(--text);min-height:400px;">
  <div id="app"></div>
</div>
<div id="toastBox"></div>
</div>

<script>
(function(){
  // ---------- DANH SACH TAI KHOAN MAU ----------
  var ACCOUNTS = [
    {username:"admin", password:"admin123", role:"admin", name:"Quản trị viên"},
    {username:"gv", password:"123456", role:"gv", name:"TS. Đào Thị Hường (Giảng viên)"},
    {username:"SV001", password:"123456", role:"sv", name:"Nguyễn Văn An (Sinh viên)", maSV:"SV001"}
  ];

  function seedTerms(){ return [
    {id:"t1", ten:"Học kỳ 1", nam:"2024-2025"},
    {id:"t2", ten:"Học kỳ 2", nam:"2024-2025"},
    {id:"t3", ten:"Học kỳ 1", nam:"2025-2026"} ]; }
  function seedSubjects(){ return [
    {id:"m1", ten:"Lập trình C++", tc:3, termId:"t1"},
    {id:"m2", ten:"Toán cao cấp A1", tc:3, termId:"t1"},
    {id:"m3", ten:"Anh văn 1", tc:2, termId:"t1"},
    {id:"m4", ten:"Cơ sở dữ liệu", tc:3, termId:"t2"},
    {id:"m5", ten:"Lập trình Java", tc:3, termId:"t2"},
    {id:"m6", ten:"Toán rời rạc", tc:3, termId:"t2"},
    {id:"m7", ten:"Mạng máy tính", tc:3, termId:"t3"},
    {id:"m8", ten:"Hệ điều hành", tc:3, termId:"t3"},
    {id:"m9", ten:"Phân tích thiết kế HTTT", tc:3, termId:"t3"} ]; }
  function seedFaculties(){ return [
    {id:"k1", maKhoa:"CNTT", tenKhoa:"Công nghệ Thông tin", sdt:"0225.3734.001"},
    {id:"k2", maKhoa:"KTĐT", tenKhoa:"Kỹ thuật Điện - Điện tử", sdt:"0225.3734.002"} ]; }
  function seedClasses(){ return [
    {id:"l1", maLop:"CNTT1", tenLop:"CNTT1", facultyId:"k1"},
    {id:"l2", maLop:"CNTT2", tenLop:"CNTT2", facultyId:"k1"},
    {id:"l3", maLop:"HTTT1", tenLop:"HTTT1", facultyId:"k1"},
    {id:"l4", maLop:"ĐT1", tenLop:"ĐT1", facultyId:"k2"},
    {id:"l5", maLop:"ĐT2", tenLop:"ĐT2", facultyId:"k2"} ]; }
  function seedStudents(){
    var names = [
      ["SV001","Nguyễn Văn An","Nam","l1","an.nv@mail.vn","0901234001"],
      ["SV002","Trần Thị Bình","Nữ","l1","binh.tt@mail.vn","0901234002"],
      ["SV003","Lê Văn Cường","Nam","l1","cuong.lv@mail.vn","0901234003"],
      ["SV004","Phạm Thu Dung","Nữ","l2","dung.pt@mail.vn","0901234004"],
      ["SV005","Hoàng Văn Em","Nam","l2","em.hv@mail.vn","0901234005"],
      ["SV006","Vũ Thị Phượng","Nữ","l2","phuong.vt@mail.vn","0901234006"],
      ["SV007","Đặng Văn Giang","Nam","l3","giang.dv@mail.vn","0901234007"],
      ["SV008","Bùi Thị Hương","Nữ","l3","huong.bt@mail.vn","0901234008"],
      ["SV009","Đỗ Văn Khánh","Nam","l3","khanh.dv@mail.vn","0901234009"],
      ["SV010","Ngô Thị Lan","Nữ","l1","lan.nt@mail.vn","0901234010"],
      ["SV011","Dương Văn Minh","Nam","l2","minh.dv@mail.vn","0901234011"],
      ["SV012","Lý Thị Nga","Nữ","l3","nga.lt@mail.vn","0901234012"]
    ];
    var st=[];
    for(var i=0;i<names.length;i++){
      var diem=[];
      for(var j=0;j<6;j++){
        var qt=Math.round((5+Math.random()*4.5)*10)/10;
        var thi=Math.round((4+Math.random()*5.5)*10)/10;
        diem.push({subjId:"m"+(j+1), qt:qt, thi:thi});
      }
      st.push({maSV:names[i][0], hoTen:names[i][1], gioiTinh:names[i][2], lopId:names[i][3], email:names[i][4], sdt:names[i][5], diem:diem});
    }
    return st;
  }

  var state = {view:"dashboard", user:null, students:[], terms:[], subjects:[], faculties:[], classes:[],
    search:"", filterClass:"all", showForm:false, editingId:null, scoreStudentId:null,
    showTermForm:false, editingTermId:null,
    showFacultyForm:false, editingFacultyId:null, showClassForm:false, editingClassId:null,
    loginError:""};

  function load(){
    try{
      var raw=localStorage.getItem("qlsv_data_v4");
      if(raw){ var o=JSON.parse(raw); state.students=o.students; state.terms=o.terms; state.subjects=o.subjects; state.faculties=o.faculties; state.classes=o.classes; }
      else { state.terms=seedTerms(); state.subjects=seedSubjects(); state.faculties=seedFaculties(); state.classes=seedClasses(); state.students=seedStudents(); save(); }
      var u=localStorage.getItem("qlsv_session");
      if(u) state.user=JSON.parse(u);
    }catch(e){ state.terms=seedTerms(); state.subjects=seedSubjects(); state.faculties=seedFaculties(); state.classes=seedClasses(); state.students=seedStudents(); }
  }
  function save(){
    try{ localStorage.setItem("qlsv_data_v4", JSON.stringify({students:state.students, terms:state.terms, subjects:state.subjects, faculties:state.faculties, classes:state.classes})); }catch(e){}
  }
  function saveSession(){ try{ localStorage.setItem("qlsv_session", JSON.stringify(state.user)); }catch(e){} }
  function uid(p){ return p+"_"+Date.now()+"_"+Math.floor(Math.random()*1000); }
  function isAdmin(){ return state.user && state.user.role==="admin"; }
  function isGV(){ return state.user && state.user.role==="gv"; }
  function isSV(){ return state.user && state.user.role==="sv"; }
  function canEditData(){ return isAdmin(); } // them/sua/xoa khoa, lop, hoc ky, sinh vien
  function canInputScore(){ return isAdmin() || isGV(); }
  function tenLop(lopId){ var l=state.classes.find(function(x){return x.id===lopId;}); return l? l.tenLop : "—"; }
  function tenKhoa(fid){ var k=state.faculties.find(function(x){return x.id===fid;}); return k? k.tenKhoa : "—"; }

  function diemTK(d){ return (d.qt*0.4 + d.thi*0.6); }
  function subjectsOf(termId){ return state.subjects.filter(function(m){return m.termId===termId;}); }
  function diemOf(sv, subjId){ return (sv.diem||[]).find(function(d){return d.subjId===subjId;}); }
  function diemTBMon(sv, listSubj){
    if(!listSubj||!listSubj.length) return null;
    var tongD=0, tongTC=0, co=false;
    for(var i=0;i<listSubj.length;i++){
      var d=diemOf(sv, listSubj[i].id);
      if(d){ tongD+=diemTK(d)*listSubj[i].tc; tongTC+=listSubj[i].tc; co=true; }
    }
    if(!co||!tongTC) return null;
    return Math.round(tongD/tongTC*100)/100;
  }
  function diemTBHocKy(sv, termId){ return diemTBMon(sv, subjectsOf(termId)); }
  function gpaLuyKe(sv, termIndex){
    var mon=[];
    for(var i=0;i<=termIndex && i<state.terms.length;i++) mon=mon.concat(subjectsOf(state.terms[i].id));
    return diemTBMon(sv, mon);
  }
  function gpa(sv){ return diemTBMon(sv, state.subjects) || 0; }
  function tongTC(sv){
    var t=0;
    for(var i=0;i<(sv.diem||[]).length;i++){ var m=state.subjects.find(function(x){return x.id===sv.diem[i].subjId;}); if(m) t+=m.tc; }
    return t;
  }
  function xeploai(d){
    if(d==null) return {t:"Chưa có", c:"#64748b", bg:"rgba(100,116,139,.12)"};
    if(d>=8) return {t:"Giỏi", c:"#297a2e", bg:"rgba(41,122,46,.14)"};
    if(d>=6.5) return {t:"Khá", c:"#d97706", bg:"rgba(217,119,6,.14)"};
    if(d>=5) return {t:"TB", c:"#2563eb", bg:"rgba(37,99,235,.12)"};
    return {t:"Yếu", c:"#dc2626", bg:"rgba(220,38,38,.12)"};
  }
  function fmt(d){ return d==null ? "—" : (Math.round(d*100)/100).toFixed(2); }
  function toast(msg){
    var box=document.getElementById("toastBox");
    var el=document.createElement("div"); el.className="toast"; el.textContent=msg;
    box.appendChild(el);
    setTimeout(function(){ el.style.opacity="0"; el.style.transition="opacity .4s"; setTimeout(function(){el.remove();},400); },1800);
  }

  var app=document.getElementById("app");
  var chartInstances=[];
  function destroyCharts(){ for(var i=0;i<chartInstances.length;i++){ try{chartInstances[i].destroy();}catch(e){} } chartInstances=[]; }

  // ---------- LOGIN ----------
  function renderLogin(){
    destroyCharts();
    var html='<div class="fade-in" style="max-width:420px;margin:60px auto;padding:0 20px;">'
      + '<div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center;">'
      + '<div style="width:64px;height:64px;border-radius:18px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);margin:0 auto 16px;"><i class="ri-graduation-cap-fill" style="font-size:34px;"></i></div>'
      + '<h1 style="font-size:22px;font-weight:800;margin:0 0 4px;">HỆ THỐNG QUẢN LÝ SINH VIÊN</h1>'
      + '<p style="color:var(--muted);font-size:13px;margin:0 0 22px;">Trường Đại học Hải Phòng</p>'
      + (state.loginError? '<p style="color:#dc2626;font-size:13px;font-weight:600;margin:0 0 12px;"><i class="ri-error-warning-line"></i> '+state.loginError+'</p>':'')
      + '<form id="loginForm" style="text-align:left;">'
      + '<label class="f-lbl">Tên đăng nhập</label>'
      + '<div style="position:relative;margin-bottom:14px;"><i class="ri-user-line" style="position:absolute;left:12px;top:11px;color:var(--muted);"></i><input class="inp" name="username" required style="padding-left:36px;" placeholder="admin / gv / SV001"></div>'
      + '<label class="f-lbl">Mật khẩu</label>'
      + '<div style="position:relative;margin-bottom:18px;"><i class="ri-lock-line" style="position:absolute;left:12px;top:11px;color:var(--muted);"></i><input class="inp" type="password" name="password" required style="padding-left:36px;" placeholder="••••••••"></div>'
      + '<button type="submit" class="btn-primary" style="width:100%;padding:11px;font-size:15px;"><i class="ri-login-box-line"></i> Đăng nhập</button>'
      + '</form>'
      + '<div style="margin-top:20px;padding-top:16px;border-top:1px dashed var(--border);text-align:left;">'
      + '<p style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;">Tài khoản mẫu</p>'
      + '<div style="font-size:12.5px;line-height:1.9;color:var(--text);">'
      + '<div><span class="pill" style="background:var(--accent-soft);color:var(--accent);">Admin</span> <code style="background:#f1f5f9;padding:1px 6px;border-radius:4px;">admin / admin123</code> — toàn quyền</div>'
      + '<div><span class="pill" style="background:var(--accent2-soft);color:var(--accent2);">Giảng viên</span> <code style="background:#f1f5f9;padding:1px 6px;border-radius:4px;">gv / 123456</code> — xem & nhập điểm</div>'
      + '<div><span class="pill" style="background:rgba(37,99,235,.12);color:#2563eb;">Sinh viên</span> <code style="background:#f1f5f9;padding:1px 6px;border-radius:4px;">SV001 / 123456</code> — chỉ xem điểm</div>'
      + '</div></div></div></div>';
    app.innerHTML=html;
  }

  // ---------- LAYOUT CHINH ----------
  function navItems(){
    var items=[
      {view:"dashboard", icon:"ri-dashboard-line", label:"Tổng quan"},
      {view:"students", icon:"ri-user-3-line", label:"Sinh viên"},
      {view:"scores", icon:"ri-file-list-3-line", label:"Bảng điểm & GPA"},
      {view:"terms", icon:"ri-calendar-2-line", label:"Học kỳ & Môn học"}
    ];
    if(isAdmin()) items.push({view:"faculties", icon:"ri-building-2-line", label:"Khoa & Lớp"});
    if(isSV()){ // sinh vien chi thay tab bang diem
      items=[{view:"scores", icon:"ri-file-list-3-line", label:"Bảng điểm của tôi"}];
    }
    return items;
  }
  function layout(contentHtml){
    var items=navItems();
    var navHtml='';
    for(var i=0;i<items.length;i++){
      navHtml+='<div class="nav-item '+(state.view===items[i].view?'active':'')+'" data-view="'+items[i].view+'"><i class="'+items[i].icon+'" style="font-size:18px;"></i>'+items[i].label+'</div>';
    }
    var roleLabel = isAdmin()? "Quản trị viên" : (isGV()? "Giảng viên" : "Sinh viên");
    var roleColor = isAdmin()? "var(--accent)" : (isGV()? "var(--accent2)" : "#2563eb");
    return '<div style="display:flex;flex-wrap:wrap;max-width:1200px;margin:0 auto;padding:20px;gap:20px;">'
      + '<div style="flex:0 0 230px;min-width:230px;"><div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;position:sticky;top:20px;">'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);">'
      + '<div style="width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);"><i class="ri-graduation-cap-fill" style="font-size:22px;"></i></div>'
      + '<div><div style="font-weight:800;font-size:15px;line-height:1.2;">QL Sinh Viên</div><div style="font-size:11px;color:var(--muted);">Hệ thống quản lý</div></div></div>'
      + '<div id="nav" style="display:flex;flex-direction:column;gap:4px;">'+navHtml+'</div>'
      + '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><div style="width:34px;height:34px;border-radius:50%;background:'+roleColor+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;">'+state.user.name.charAt(0)+'</div>'
      + '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+state.user.name+'</div>'
      + '<span class="pill" style="color:'+roleColor+';background:var(--accent-soft);font-size:11px;">'+roleLabel+'</span></div></div>'
      + '<button id="logoutBtn" class="btn-secondary" style="width:100%;font-size:13px;"><i class="ri-logout-box-line"></i> Đăng xuất</button>'
      + '</div></div></div>'
      + '<div style="flex:1;min-width:300px;" id="content">'+contentHtml+'</div></div>';
  }

  // ---------- DASHBOARD ----------
  function renderDashboard(){
    destroyCharts();
    var svs=state.students, total=svs.length, nam=0, nu=0, sumD=0, gioi=0;
    var byClass={};
    for(var i=0;i<svs.length;i++){
      if(svs[i].gioiTinh==="Nam") nam++; else nu++;
      sumD+=gpa(svs[i]); if(gpa(svs[i])>=8) gioi++;
      byClass[tenLop(svs[i].lopId)]=(byClass[tenLop(svs[i].lopId)]||0)+1;
    }
    var avg=total? Math.round(sumD/total*100)/100 : 0;
    var html='<div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;">'
      + '<div><h1 style="font-size:26px;font-weight:800;margin:0;">Tổng quan hệ thống</h1><p style="color:var(--muted);font-size:14px;margin:4px 0 0;">'+state.faculties.length+' khoa · '+state.classes.length+' lớp · '+state.terms.length+' học kỳ · GPA trọng số tín chỉ</p></div>'
      + '<span class="pill" style="background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);">Năm học '+state.terms[state.terms.length-1].nam+'</span></div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;">';
    var metrics=[
      {icon:"ri-user-3-fill", label:"Tổng sinh viên", val:total, sub:state.classes.length+" lớp", color:"var(--accent)"},
      {icon:"ri-building-2-fill", label:"Số khoa", val:state.faculties.length, sub:"đơn vị đào tạo", color:"#2563eb"},
      {icon:"ri-star-fill", label:"GPA trung bình", val:avg.toFixed(2), sub:"thang điểm 10", color:"var(--accent2)"},
      {icon:"ri-trophy-fill", label:"Sinh viên giỏi", val:gioi, sub:"GPA ≥ 8.0", color:"#297a2e"}
    ];
    for(var m=0;m<metrics.length;m++){
      html+='<div class="metric-card" style="flex:1 1 180px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);">'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><div style="width:34px;height:34px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:'+metrics[m].color+';"><i class="'+metrics[m].icon+'" style="font-size:17px;"></i></div>'
        + '<span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">'+metrics[m].label+'</span></div>'
        + '<div style="font-size:28px;font-weight:800;line-height:1;">'+metrics[m].val+'</div>'
        + '<div style="font-size:12px;color:var(--muted);margin-top:5px;">'+metrics[m].sub+'</div></div>';
    }
    html+='</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;">'

  function initDashboardCharts(){
    function init(n){
      if(typeof Chart==="undefined"){ if(n<40){setTimeout(function(){init(n+1);},200);} return; }
      var cb=document.getElementById("chartBar"), cp=document.getElementById("chartPie");
      if(!cb||!cp) return;
      var svs=state.students, nam=0, nu=0, byClass={};
      for(var i=0;i<svs.length;i++){ if(svs[i].gioiTinh==="Nam") nam++; else nu++; byClass[tenLop(svs[i].lopId)]=(byClass[tenLop(svs[i].lopId)]||0)+1; }
      var labels=[], data=[], gpaByClass=[];
      for(var k in byClass){ labels.push(k); data.push(byClass[k]); }
      for(var c=0;c<labels.length;c++){
        var s=0,cnt=0;
        for(i=0;i<svs.length;i++){ if(tenLop(svs[i].lopId)===labels[c]){ s+=gpa(svs[i]); cnt++; } }
        gpaByClass.push(cnt? Math.round(s/cnt*100)/100 : 0);
      }
      var c1=new Chart(cb,{type:"bar",data:{labels:labels,datasets:[{label:"Sĩ số",data:data,backgroundColor:"rgba(41,122,46,.75)",borderRadius:6,yAxisID:"y"},{label:"GPA TB",data:gpaByClass,type:"line",borderColor:"#d97706",backgroundColor:"#d97706",tension:.35,yAxisID:"y1",pointRadius:4}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:12}}}},scales:{y:{beginAtZero:true,grid:{color:"rgba(15,23,42,.06)"}},y1:{position:"right",beginAtZero:true,max:10,grid:{display:false}},x:{grid:{display:false}}}}});
      var c2=new Chart(cp,{type:"doughnut",data:{labels:["Nam","Nữ"],datasets:[{data:[nam,nu],backgroundColor:["#2563eb","#d97706"],borderWidth:2,borderColor:"#fff"}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:12}}},cutout:"62%"}}});
      chartInstances.push(c1,c2);
    }
    init(0);
  }

  // ---------- ROUTER ----------
  function render(){
    if(!state.user){ renderLogin(); return; }
    destroyCharts();
    var inner="";
    if(state.view==="dashboard") inner=renderDashboard();
    else if(state.view==="students") inner=renderStudents();
    else if(state.view==="scores") inner=renderScores();
    else if(state.view==="terms") inner=renderTerms();
    else if(state.view==="faculties") inner=renderFaculties();
    else inner=renderDashboard();
    app.innerHTML = layout(inner);
    if(state.view==="dashboard") initDashboardCharts();
  }

  // ---------- EVENTS ----------
  app.addEventListener("submit", function(e){
    e.preventDefault();
    if(e.target.id==="loginForm"){
      var f=new FormData(e.target);
      var u=f.get("username").trim(), p=f.get("password");
      var acc=ACCOUNTS.find(function(a){return a.username===u && a.password===p;});
      if(!acc){ state.loginError="Sai tên đăng nhập hoặc mật khẩu!"; renderLogin(); return; }
      state.user={username:acc.username, role:acc.role, name:acc.name, maSV:acc.maSV||null};
      state.loginError=""; state.view = acc.role==="sv"? "scores" : "dashboard";
      saveSession(); render(); toast("Đăng nhập thành công: "+acc.name); return;
    }
    if(e.target.id==="svForm"){
      var f2=new FormData(e.target);
      var maSV=f2.get("maSV").trim();
      var obj={maSV:maSV, hoTen:f2.get("hoTen").trim(), gioiTinh:f2.get("gioiTinh"), lopId:f2.get("lopId"), email:f2.get("email").trim(), sdt:f2.get("sdt").trim(), diem:[]};
      if(state.editingId){
        var idx=state.students.findIndex(function(x){return x.maSV===state.editingId;});
        if(idx>=0){ obj.diem=state.students[idx].diem; state.students[idx]=obj; }
        toast("Đã cập nhật sinh viên");
      } else {
        if(state.students.find(function(x){return x.maSV===maSV;})){ alert("Mã sinh viên đã tồn tại!"); return; }
        state.students.push(obj); toast("Đã thêm sinh viên");
      }
      save(); state.showForm=false; state.editingId=null; render(); return;
    }
    if(e.target.id==="scoreForm"){
      var cur=state.students.find(function(x){return x.maSV===state.scoreStudentId;});
      if(!cur) return;
      var diemMoi=[];
      for(var i=0;i<state.subjects.length;i++){
        var qtEl=e.target.querySelector('[name="qt_'+state.subjects[i].id+'"]');
        var thiEl=e.target.querySelector('[name="thi_'+state.subjects[i].id+'"]');
        if(!qtEl||!thiEl) continue;
        var qt=qtEl.value, thi=thiEl.value;
        if(qt!==""&&thi!==""){
          diemMoi.push({subjId:state.subjects[i].id, qt:Math.max(0,Math.min(10,parseFloat(qt))), thi:Math.max(0,Math.min(10,parseFloat(thi)))});
        }
      }
      cur.diem=diemMoi; save(); render(); toast("Đã lưu điểm - GPA đã cập nhật"); return;
    }
    if(e.target.id==="termForm"){
      var ft=new FormData(e.target);
      var ten=ft.get("tenHK").trim(), nam=ft.get("namHoc").trim();
      if(state.editingTermId){
        var ti=state.terms.findIndex(function(x){return x.id===state.editingTermId;});
        if(ti>=0){ state.terms[ti].ten=ten; state.terms[ti].nam=nam; }
        toast("Đã cập nhật học kỳ");
      } else { state.terms.push({id:uid("t"), ten:ten, nam:nam}); toast("Đã thêm học kỳ mới"); }
      save(); state.showTermForm=false; state.editingTermId=null; render(); return;
    }
    if(e.target.classList.contains("monForm")){
      var fm=new FormData(e.target);
      state.subjects.push({id:uid("m"), ten:fm.get("tenMon").trim(), tc:parseInt(fm.get("soTC"))||3, termId:e.target.getAttribute("data-termid")});
      save(); render(); toast("Đã thêm môn học"); return;
    }
    if(e.target.id==="facultyForm"){
      var ff=new FormData(e.target);
      if(state.editingFacultyId){
        var fi=state.faculties.find(function(x){return x.id===state.editingFacultyId;});
        if(fi){ fi.tenKhoa=ff.get("tenKhoa").trim(); fi.sdt=ff.get("sdt").trim(); }
        toast("Đã cập nhật khoa");
      } else {
        var ma=ff.get("maKhoa").trim();
        if(state.faculties.find(function(x){return x.maKhoa===ma;})){ alert("Mã khoa đã tồn tại!"); return; }
        state.faculties.push({id:uid("k"), maKhoa:ma, tenKhoa:ff.get("tenKhoa").trim(), sdt:ff.get("sdt").trim()});
        toast("Đã thêm khoa mới");
      }
      save(); state.showFacultyForm=false; state.editingFacultyId=null; render(); return;
    }
    if(e.target.id==="classForm"){
      var fc=new FormData(e.target);
      if(state.editingClassId){
        var ci=state.classes.find(function(x){return x.id===state.editingClassId;});
        if(ci){ ci.tenLop=fc.get("tenLop").trim(); ci.facultyId=fc.get("facultyId"); }
        toast("Đã cập nhật lớp");
      } else {
        var ml=fc.get("maLop").trim();
        if(state.classes.find(function(x){return x.maLop===ml;})){ alert("Mã lớp đã tồn tại!"); return; }
        state.classes.push({id:uid("l"), maLop:ml, tenLop:fc.get("tenLop").trim(), facultyId:fc.get("facultyId")});
        toast("Đã thêm lớp mới");
      }
      save(); state.showClassForm=false; state.editingClassId=null; render(); return;
    }
  });

  app.addEventListener("click", function(e){
    // Logout
    if(e.target.closest("#logoutBtn")){
      state.user=null; localStorage.removeItem("qlsv_session"); state.view="dashboard"; render(); return;
    }
    if(!state.user) return;
    // Nav
    var nav=e.target.closest(".nav-item");
    if(nav){ state.view=nav.getAttribute("data-view"); state.showForm=false; state.showTermForm=false; state.editingTermId=null; state.showFacultyForm=false; state.editingFacultyId=null; state.showClassForm=false; state.editingClassId=null; render(); return; }
    // Students
    if(e.target.closest("#addBtn")){ state.showForm=true; state.editingId=null; render(); return; }
    if(e.target.closest("#cancelForm")){ state.showForm=false; state.editingId=null; render(); return; }
    var ed=e.target.closest("[data-edit]");
    if(ed){ state.editingId=ed.getAttribute("data-edit"); state.showForm=true; render(); return; }
    var dl=e.target.closest("[data-del]");
    if(dl){
      var id=dl.getAttribute("data-del");
      var sv=state.students.find(function(x){return x.maSV===id;});
      if(confirm("Xóa sinh viên "+(sv?sv.hoTen:id)+"?")){ state.students=state.students.filter(function(x){return x.maSV!==id;}); save(); render(); toast("Đã xóa sinh viên"); }
      return;
    }
    // Terms
    if(e.target.closest("#addTermBtn")){ state.showTermForm=true; state.editingTermId=null; render(); return; }
    if(e.target.closest("#cancelTermBtn")){ state.showTermForm=false; state.editingTermId=null; render(); return; }
    var et=e.target.closest("[data-editterm]");
    if(et){ state.editingTermId=et.getAttribute("data-editterm"); state.showTermForm=false; render(); return; }
    var dt=e.target.closest("[data-delterm]");
    if(dt){
      var tid=dt.getAttribute("data-delterm");
      var monIds=subjectsOf(tid).map(function(m){return m.id;});
      if(confirm("Xóa học kỳ này? Sẽ xóa "+monIds.length+" môn và điểm liên quan.")){
        state.subjects=state.subjects.filter(function(m){return m.termId!==tid;});
        for(var i=0;i<state.students.length;i++) state.students[i].diem=(state.students[i].diem||[]).filter(function(d){return monIds.indexOf(d.subjId)<0;});
        state.terms=state.terms.filter(function(x){return x.id!==tid;});
        save(); render(); toast("Đã xóa học kỳ");
      }
      return;
    }
    var ds=e.target.closest("[data-delsubj]");
    if(ds){
      var sid=ds.getAttribute("data-delsubj");
      if(confirm("Xóa môn này và điểm liên quan?")){
        state.subjects=state.subjects.filter(function(m){return m.id!==sid;});
        for(var k=0;k<state.students.length;k++) state.students[k].diem=(state.students[k].diem||[]).filter(function(d){return d.subjId!==sid;});
        save(); render(); toast("Đã xóa môn");
      }
      return;
    }
    // Faculties
    if(e.target.closest("#addFacultyBtn")){ state.showFacultyForm=true; state.editingFacultyId=null; render(); return; }
    if(e.target.closest("#cancelFacultyBtn")){ state.showFacultyForm=false; state.editingFacultyId=null; render(); return; }
    var ef2=e.target.closest("[data-editfaculty]");
    if(ef2){ state.editingFacultyId=ef2.getAttribute("data-editfaculty"); state.showFacultyForm=true; render(); return; }
    var df=e.target.closest("[data-delfaculty]");
    if(df){
      var fid=df.getAttribute("data-delfaculty");
      var lopIds=state.classes.filter(function(l){return l.facultyId===fid;}).map(function(l){return l.id;});
      if(confirm("Xóa khoa này? Sẽ xóa "+lopIds.length+" lớp thuộc khoa.")){
        state.classes=state.classes.filter(function(l){return l.facultyId!==fid;});
        state.faculties=state.faculties.filter(function(x){return x.id!==fid;});
        save(); render(); toast("Đã xóa khoa");
      }
      return;
    }
    // Classes
    if(e.target.closest("#addClassBtn")){ state.showClassForm=true; state.editingClassId=null; render(); return; }
    if(e.target.closest("#cancelClassBtn")){ state.showClassForm=false; state.editingClassId=null; render(); return; }
    var ec2=e.target.closest("[data-editclass]");
    if(ec2){ state.editingClassId=ec2.getAttribute("data-editclass"); state.showClassForm=true; render(); return; }
    var dc=e.target.closest("[data-delclass]");
    if(dc){
      var cid=dc.getAttribute("data-delclass");
      var nSV=state.students.filter(function(s){return s.lopId===cid;}).length;
      if(confirm("Xóa lớp này? Lớp có "+nSV+" sinh viên sẽ không còn lớp.")){
        state.classes=state.classes.filter(function(x){return x.id!==cid;});
        save(); render(); toast("Đã xóa lớp");
      }
      return;
    }
  });
  app.addEventListener("input", function(e){
    if(e.target.id==="searchInp"){ state.search=e.target.value; render(); }
  });
  app.addEventListener("change", function(e){
    if(e.target.id==="classFilter"){ state.filterClass=e.target.value; render(); }
    if(e.target.id==="scoreSelect"){ state.scoreStudentId=e.target.value; render(); }
  });

  load(); render();
})();
</script>
</html>
